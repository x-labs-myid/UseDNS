[package]
name = "usedns"
version = "1.0.0"
edition = "2024"
build = "build.rs"
description = "A simple DNS changer and recommendation app"
license = "MIT"

[dependencies]
base64 = "0.22"
directories = "6.0"
raw-window-handle = "0.6"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
slint = { version = "1.17.1", features = ["raw-window-handle-06", "unstable-winit-030"] }

[build-dependencies]
slint-build = "1.17.1"


[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_NetworkManagement_IpHelper",
    "Win32_NetworkManagement_Ndis",
    "Win32_System_Registry",
    "Win32_System_Threading",
    "Win32_UI_Shell",
] }

[target.'cfg(windows)'.build-dependencies]
ico = "0.4"
image = { version = "0.25", default-features = false, features = ["png"] }
winresource = "0.1"

# Keep local debug builds small: skip DWARF/PDB for the crate and all deps.
# This is debug *info*, not opt-level — compile stays fast.
[profile.dev]
debug = 0
incremental = true

[profile.dev.package."*"]
debug = false

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true
debug = false
