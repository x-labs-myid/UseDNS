[package]
name = "usedns"
version = "0.1.0"
edition = "2024"
build = "build.rs"
description = "A simple DNS changer and recommendation app"
license = "MIT"

[dependencies]
directories = "6.0"
raw-window-handle = "0.6"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
slint = { version = "1.17.1", features = ["raw-window-handle-06"] }

[build-dependencies]
lucide-slint = "1.43.0"
slint-build = "1.17.1"


[target.'cfg(windows)'.build-dependencies]
ico = "0.4"
image = { version = "0.25", default-features = false, features = ["png"] }
winresource = "0.1"
