name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  meta:
    name: Validate tag
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.parse.outputs.version }}
      channel: ${{ steps.parse.outputs.channel }}
      prerelease: ${{ steps.parse.outputs.prerelease }}
      package_version: ${{ steps.parse.outputs.package_version }}
      rpm_release: ${{ steps.parse.outputs.rpm_release }}
      macos_build_version: ${{ steps.parse.outputs.macos_build_version }}
    steps:
      - name: Parse release tag
        id: parse
        shell: bash
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME}"
          if [[ ! "${tag}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-(alpha|beta|rc)(\.[0-9]+)?)?$ ]]; then
            echo "Invalid tag '${tag}'."
            echo "Use vMAJOR.MINOR.PATCH, optionally with -alpha, -alpha.N, -beta, -beta.N, -rc, or -rc.N"
            echo "Examples: v1.0.0  v1.0.0-alpha.1  v1.0.0-beta.2  v1.0.0-rc.1"
            exit 1
          fi

          version="${tag#v}"
          channel="stable"
          prerelease="false"
          if [[ "${version}" == *"-alpha"* ]]; then
            channel="alpha"
            prerelease="true"
          elif [[ "${version}" == *"-beta"* ]]; then
            channel="beta"
            prerelease="true"
          elif [[ "${version}" == *"-rc"* ]]; then
            channel="rc"
            prerelease="true"
          fi

          package_version="${version%%-*}"
          rpm_release="1"
          if [[ "${version}" == *"-"* ]]; then
            prerelease_label="${version#*-}"
            prerelease_label="${prerelease_label//-/.}"
            rpm_release="0.1.${prerelease_label}"
          fi

          echo "version=${version}" >> "${GITHUB_OUTPUT}"
          echo "channel=${channel}" >> "${GITHUB_OUTPUT}"
          echo "prerelease=${prerelease}" >> "${GITHUB_OUTPUT}"
          echo "package_version=${package_version}" >> "${GITHUB_OUTPUT}"
          echo "rpm_release=${rpm_release}" >> "${GITHUB_OUTPUT}"
          echo "macos_build_version=${GITHUB_RUN_NUMBER}" >> "${GITHUB_OUTPUT}"
          echo "Tag ${tag} → version ${version} (${channel})"

  build:
    name: ${{ matrix.name }}
    needs: meta
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows x64
            os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact: usedns.exe
            asset_suffix: windows-x86_64.exe
          - name: Linux x64
            os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            artifact: usedns
            asset_suffix: linux-x86_64
          - name: macOS Apple Silicon
            os: macos-latest
            target: aarch64-apple-darwin
            artifact: usedns
            asset_suffix: macos-aarch64
          # Intel binary is cross-compiled on Apple Silicon. Hosted Intel
          # runners (macos-13 / macos-15-intel) are scarce and very slow.
          - name: macOS Intel
            os: macos-latest
            target: x86_64-apple-darwin
            artifact: usedns
            asset_suffix: macos-x86_64
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Linux GUI dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            pkg-config \
            libfontconfig1-dev \
            libfreetype6-dev \
            libxkbcommon-dev \
            libxkbcommon-x11-dev \
            libxcb1-dev \
            libxcb-render0-dev \
            libxcb-shape0-dev \
            libxcb-xfixes0-dev \
            libxcb-icccm4-dev

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Build release
        run: cargo build --locked --release --target ${{ matrix.target }}

      - name: Package Windows installer
        if: runner.os == 'Windows'
        env:
          VERSION: ${{ needs.meta.outputs.version }}
        run: |
          mkdir dist
          Copy-Item "target\${{ matrix.target }}\release\usedns.exe" "packaging\windows\usedns.exe"
          choco install nsis --no-progress -y
          $makensis = "${env:ProgramFiles(x86)}\NSIS\makensis.exe"
          $outfile = Join-Path (Resolve-Path dist).Path "usedns-$env:VERSION-windows-x86_64-setup.exe"
          & $makensis `
            "/DAPP_VERSION=$env:VERSION" `
            "/DOUT_FILE=$outfile" `
            "packaging\windows\installer.nsi"
          if ($LASTEXITCODE -ne 0) { throw "NSIS failed" }
          Get-ChildItem dist

      - name: Package Windows MSI
        if: runner.os == 'Windows'
        env:
          VERSION: ${{ needs.meta.outputs.version }}
          PRODUCT_VERSION: ${{ needs.meta.outputs.package_version }}
        run: |
          $candle = Get-ChildItem `
            -Path "${env:ProgramFiles(x86)}\WiX Toolset v3*\bin\candle.exe" `
            -ErrorAction SilentlyContinue |
            Sort-Object FullName -Descending |
            Select-Object -First 1
          if (-not $candle) {
            choco install wixtoolset --no-progress -y
            if ($LASTEXITCODE -ne 0) { throw "WiX installation failed" }
            $candle = Get-ChildItem `
              -Path "${env:ProgramFiles(x86)}\WiX Toolset v3*\bin\candle.exe" `
              -ErrorAction Stop |
              Sort-Object FullName -Descending |
              Select-Object -First 1
          }
          $wixBin = $candle.DirectoryName
          $wixObject = Join-Path $env:RUNNER_TEMP "usedns-installer.wixobj"
          & "$wixBin\candle.exe" `
            -nologo `
            -arch x64 `
            "-dProductVersion=$env:PRODUCT_VERSION" `
            -out $wixObject `
            "packaging\windows\installer.wxs"
          if ($LASTEXITCODE -ne 0) { throw "WiX candle failed" }
          & "$wixBin\light.exe" `
            -nologo `
            -sice:ICE61 `
            -out "dist\usedns-$env:VERSION-windows-x86_64.msi" `
            $wixObject
          if ($LASTEXITCODE -ne 0) { throw "WiX light failed" }

      - name: Package Linux archive and .deb
        if: runner.os == 'Linux'
        env:
          VERSION: ${{ needs.meta.outputs.version }}
        run: |
          set -euo pipefail
          mkdir -p dist staging
          cp "target/${{ matrix.target }}/release/usedns" staging/usedns
          chmod +x staging/usedns
          tar -C staging -czf "dist/usedns-${VERSION}-linux-x86_64.tar.gz" usedns

          deb_version="${VERSION}"
          if [[ "${VERSION}" == *-* ]]; then
            deb_version="${VERSION%%-*}~${VERSION#*-}"
          fi

          pkg_root="pkg-deb"
          mkdir -p "${pkg_root}/DEBIAN" \
            "${pkg_root}/usr/bin" \
            "${pkg_root}/usr/share/applications" \
            "${pkg_root}/usr/share/pixmaps" \
            "${pkg_root}/usr/share/doc/usedns"
          cp staging/usedns "${pkg_root}/usr/bin/usedns"
          chmod 755 "${pkg_root}/usr/bin/usedns"
          cp packaging/linux/usedns.desktop "${pkg_root}/usr/share/applications/usedns.desktop"
          if [[ -f .assets/UseDNS.png ]]; then
            cp .assets/UseDNS.png "${pkg_root}/usr/share/pixmaps/usedns.png"
          fi
          sed "s/DEB_VERSION/${deb_version}/g" packaging/linux/control > "${pkg_root}/DEBIAN/control"
          echo "See https://github.com/x-labs-myid/UseDNS" > "${pkg_root}/usr/share/doc/usedns/README"
          dpkg-deb --root-owner-group --build "${pkg_root}" "dist/usedns_${deb_version}_amd64.deb"
          dpkg-deb --info "dist/usedns_${deb_version}_amd64.deb"
          ls -lh dist

      - name: Package Linux RPM
        if: runner.os == 'Linux'
        env:
          RPM_VERSION: ${{ needs.meta.outputs.package_version }}
          RPM_RELEASE: ${{ needs.meta.outputs.rpm_release }}
          RELEASE_VERSION: ${{ needs.meta.outputs.version }}
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y rpm
          rpm_root="${RUNNER_TEMP}/rpmbuild"
          mkdir -p "${rpm_root}/BUILD" "${rpm_root}/BUILDROOT" \
            "${rpm_root}/RPMS" "${rpm_root}/SOURCES" "${rpm_root}/SPECS" "${rpm_root}/SRPMS"
          cp "target/${{ matrix.target }}/release/usedns" "${rpm_root}/SOURCES/usedns"
          cp packaging/linux/usedns.desktop "${rpm_root}/SOURCES/usedns.desktop"
          cp .assets/UseDNS.png "${rpm_root}/SOURCES/usedns.png"
          cp LICENSE README.md "${rpm_root}/SOURCES/"
          cp packaging/linux/usedns.spec "${rpm_root}/SPECS/usedns.spec"
          rpmbuild -bb \
            --define "_topdir ${rpm_root}" \
            --define "version ${RPM_VERSION}" \
            --define "release ${RPM_RELEASE}" \
            "${rpm_root}/SPECS/usedns.spec"
          rpm_file="$(find "${rpm_root}/RPMS" -name '*.rpm' -type f -print -quit)"
          test -n "${rpm_file}"
          cp "${rpm_file}" "dist/usedns-${RELEASE_VERSION}-x86_64.rpm"
          rpm -qip "dist/usedns-${RELEASE_VERSION}-x86_64.rpm"
          rpm -qlp "dist/usedns-${RELEASE_VERSION}-x86_64.rpm"

      - name: Package macOS app and DMG
        if: runner.os == 'macOS'
        env:
          VERSION: ${{ needs.meta.outputs.version }}
          SHORT_VERSION: ${{ needs.meta.outputs.package_version }}
          BUILD_VERSION: ${{ needs.meta.outputs.macos_build_version }}
        run: |
          set -euo pipefail
          mkdir -p dist "UseDNS.app/Contents/MacOS" UseDNS.app/Contents/Resources
          cp "target/${{ matrix.target }}/release/usedns" UseDNS.app/Contents/MacOS/UseDNS
          chmod +x UseDNS.app/Contents/MacOS/UseDNS
          sed \
            -e "s/SHORT_VERSION/${SHORT_VERSION}/g" \
            -e "s/BUILD_VERSION/${BUILD_VERSION}/g" \
            packaging/macos/Info.plist > UseDNS.app/Contents/Info.plist

          iconset="${RUNNER_TEMP}/UseDNS.iconset"
          mkdir -p "${iconset}"
          for size in 16 32 128 256 512; do
            double=$((size * 2))
            sips -z "${size}" "${size}" .assets/UseDNS.png --out "${iconset}/icon_${size}x${size}.png" >/dev/null
            sips -z "${double}" "${double}" .assets/UseDNS.png --out "${iconset}/icon_${size}x${size}@2x.png" >/dev/null
          done
          iconutil -c icns "${iconset}" -o UseDNS.app/Contents/Resources/UseDNS.icns

          ditto -c -k --keepParent UseDNS.app "dist/usedns-${VERSION}-${{ matrix.asset_suffix }}.zip"
          dmg_stage="${RUNNER_TEMP}/usedns-dmg"
          mkdir -p "${dmg_stage}"
          cp -R UseDNS.app "${dmg_stage}/UseDNS.app"
          ln -s /Applications "${dmg_stage}/Applications"
          dmg="dist/usedns-${VERSION}-${{ matrix.asset_suffix }}.dmg"
          hdiutil create -volname "UseDNS ${VERSION}" -srcfolder "${dmg_stage}" -ov -format UDZO "${dmg}"
          hdiutil verify "${dmg}"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: dist-${{ matrix.asset_suffix }}
          path: dist/*
          if-no-files-found: error

  publish:
    name: GitHub Release
    needs: [meta, build]
    runs-on: ubuntu-latest
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Checksums
        working-directory: dist
        run: |
          sha256sum * | tee SHA256SUMS.txt
          ls -lh

      - name: Write release notes
        id: notes
        env:
          VERSION: ${{ needs.meta.outputs.version }}
          CHANNEL: ${{ needs.meta.outputs.channel }}
        run: |
          set -euo pipefail
          deb_version="${VERSION}"
          if [[ "${VERSION}" == *-* ]]; then
            deb_version="${VERSION%%-*}~${VERSION#*-}"
          fi
          {
            case "${CHANNEL}" in
              alpha)
                echo "First look at ${VERSION}. This is an alpha, so expect unfinished bits and the occasional surprise."
                echo
                echo "If you try it, please file issues. That's the whole point of putting this out."
                ;;
              beta)
                echo "${VERSION} is a beta. The main pieces are in place, but we are still shaking out bugs before a real release."
                echo
                echo "Worth installing if you want to help find problems. Maybe skip it if you need something quiet and boring."
                ;;
              rc)
                echo "${VERSION} is a release candidate. Unless something ugly shows up, the next cut should be the stable build."
                echo
                echo "Please try the Windows DNS apply/reset flow if you can. That is the part we care about most."
                ;;
              *)
                echo "UseDNS ${VERSION} is out."
                echo
                echo "Grab the build for your machine below. On Windows, run the app as Administrator if you actually need to change DNS."
                ;;
            esac
            echo
            echo "Downloads:"
            echo
            echo "- Windows (NSIS): \`usedns-${VERSION}-windows-x86_64-setup.exe\` — interactive setup with Start Menu and desktop shortcuts."
            echo "- Windows (MSI): \`usedns-${VERSION}-windows-x86_64.msi\` — Windows Installer package for managed deployment."
            echo "- Linux (Debian/Ubuntu): \`usedns_${deb_version}_amd64.deb\` — install with \`sudo apt install ./usedns_*.deb\`."
            echo "- Linux (Fedora/RHEL/openSUSE): \`usedns-${VERSION}-x86_64.rpm\` — install with your RPM package manager."
            echo "- Linux (tarball): \`usedns-${VERSION}-linux-x86_64.tar.gz\` — unpack and run \`./usedns\`."
            echo "- macOS Apple Silicon: \`usedns-${VERSION}-macos-aarch64.dmg\` or the matching ZIP."
            echo "- macOS Intel: \`usedns-${VERSION}-macos-x86_64.dmg\` or the matching ZIP."
            echo
            echo "SHA256 checksums are in \`SHA256SUMS.txt\`."
            echo
            echo "Changing DNS only works on Windows right now. The Linux and macOS builds will open the UI, but they will not write system DNS settings."
            echo
            echo "## What's in this tag"
          } > release-notes.md

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: UseDNS ${{ needs.meta.outputs.version }}
          prerelease: ${{ needs.meta.outputs.prerelease == 'true' }}
          generate_release_notes: true
          files: dist/**
          fail_on_unmatched_files: true
          body_path: release-notes.md
