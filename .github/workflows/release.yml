name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  meta:
    name: Validate tag
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.parse.outputs.version }}
      channel: ${{ steps.parse.outputs.channel }}
      prerelease: ${{ steps.parse.outputs.prerelease }}
    steps:
      - name: Parse release tag
        id: parse
        shell: bash
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME}"
          if [[ ! "${tag}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-(alpha|beta|rc)(\.[0-9]+)?)?$ ]]; then
            echo "Invalid tag '${tag}'."
            echo "Use vMAJOR.MINOR.PATCH, optionally with -alpha, -alpha.N, -beta, -beta.N, -rc, or -rc.N"
            echo "Examples: v1.0.0  v1.0.0-alpha.1  v1.0.0-beta.2  v1.0.0-rc.1"
            exit 1
          fi

          version="${tag#v}"
          channel="stable"
          prerelease="false"
          if [[ "${version}" == *"-alpha"* ]]; then
            channel="alpha"
            prerelease="true"
          elif [[ "${version}" == *"-beta"* ]]; then
            channel="beta"
            prerelease="true"
          elif [[ "${version}" == *"-rc"* ]]; then
            channel="rc"
            prerelease="true"
          fi

          echo "version=${version}" >> "${GITHUB_OUTPUT}"
          echo "channel=${channel}" >> "${GITHUB_OUTPUT}"
          echo "prerelease=${prerelease}" >> "${GITHUB_OUTPUT}"
          echo "Tag ${tag} → version ${version} (${channel})"

  build:
    name: ${{ matrix.name }}
    needs: meta
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows x64
            os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact: usedns.exe
            asset_suffix: windows-x86_64.exe
          - name: Linux x64
            os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            artifact: usedns
            asset_suffix: linux-x86_64
          - name: macOS Apple Silicon
            os: macos-latest
            target: aarch64-apple-darwin
            artifact: usedns
            asset_suffix: macos-aarch64
          # Intel binary is cross-compiled on Apple Silicon. Hosted Intel
          # runners (macos-13 / macos-15-intel) are scarce and very slow.
          - name: macOS Intel
            os: macos-latest
            target: x86_64-apple-darwin
            artifact: usedns
            asset_suffix: macos-x86_64
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Linux GUI dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            pkg-config \
            libfontconfig1-dev \
            libfreetype6-dev \
            libxkbcommon-dev \
            libxkbcommon-x11-dev \
            libxcb1-dev \
            libxcb-render0-dev \
            libxcb-shape0-dev \
            libxcb-xfixes0-dev \
            libxcb-icccm4-dev

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Build release
        run: cargo build --locked --release --target ${{ matrix.target }}

      - name: Package Windows installer
        if: runner.os == 'Windows'
        env:
          VERSION: ${{ needs.meta.outputs.version }}
        run: |
          mkdir dist
          Copy-Item "target\${{ matrix.target }}\release\usedns.exe" "packaging\windows\usedns.exe"
          choco install nsis --no-progress -y
          $makensis = "${env:ProgramFiles(x86)}\NSIS\makensis.exe"
          $outfile = Join-Path (Resolve-Path dist).Path "usedns-$env:VERSION-windows-x86_64-setup.exe"
          & $makensis `
            "/DAPP_VERSION=$env:VERSION" `
            "/DAPP_EXE=packaging\windows\usedns.exe" `
            "/DOUT_FILE=$outfile" `
            "packaging\windows\installer.nsi"
          if ($LASTEXITCODE -ne 0) { throw "NSIS failed" }
          Get-ChildItem dist

      - name: Package Linux archive and .deb
        if: runner.os == 'Linux'
        env:
          VERSION: ${{ needs.meta.outputs.version }}
        run: |
          set -euo pipefail
          mkdir -p dist staging
          cp "target/${{ matrix.target }}/release/usedns" staging/usedns
          chmod +x staging/usedns
          tar -C staging -czf "dist/usedns-${VERSION}-linux-x86_64.tar.gz" usedns

          deb_version="${VERSION}"
          if [[ "${VERSION}" == *-* ]]; then
            deb_version="${VERSION%%-*}~${VERSION#*-}"
          fi

          pkg_root="pkg-deb"
          mkdir -p "${pkg_root}/DEBIAN" \
            "${pkg_root}/usr/bin" \
            "${pkg_root}/usr/share/applications" \
            "${pkg_root}/usr/share/pixmaps" \
            "${pkg_root}/usr/share/doc/usedns"
          cp staging/usedns "${pkg_root}/usr/bin/usedns"
          chmod 755 "${pkg_root}/usr/bin/usedns"
          cp packaging/linux/usedns.desktop "${pkg_root}/usr/share/applications/usedns.desktop"
          if [[ -f .assets/UseDNS.png ]]; then
            cp .assets/UseDNS.png "${pkg_root}/usr/share/pixmaps/usedns.png"
          fi
          sed "s/DEB_VERSION/${deb_version}/g" packaging/linux/control > "${pkg_root}/DEBIAN/control"
          echo "See https://github.com/x-labs-myid/UseDNS" > "${pkg_root}/usr/share/doc/usedns/README"
          dpkg-deb --root-owner-group --build "${pkg_root}" "dist/usedns_${deb_version}_amd64.deb"
          dpkg-deb --info "dist/usedns_${deb_version}_amd64.deb"
          ls -lh dist

      - name: Package macOS app
        if: runner.os == 'macOS'
        env:
          VERSION: ${{ needs.meta.outputs.version }}
        run: |
          mkdir -p dist "UseDNS.app/Contents/MacOS" UseDNS.app/Contents/Resources
          cp "target/${{ matrix.target }}/release/usedns" UseDNS.app/Contents/MacOS/UseDNS
          chmod +x UseDNS.app/Contents/MacOS/UseDNS
          sed "s/APP_VERSION/${VERSION}/g" packaging/macos/Info.plist > UseDNS.app/Contents/Info.plist
          if [[ -f .assets/UseDNS.png ]]; then
            mkdir -p UseDNS.app/Contents/Resources
            cp .assets/UseDNS.png UseDNS.app/Contents/Resources/UseDNS.png
          fi
          ditto -c -k --keepParent UseDNS.app "dist/usedns-${VERSION}-${{ matrix.asset_suffix }}.zip"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: dist-${{ matrix.asset_suffix }}
          path: dist/*
          if-no-files-found: error

  publish:
    name: GitHub Release
    needs: [meta, build]
    runs-on: ubuntu-latest
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Checksums
        working-directory: dist
        run: |
          sha256sum * | tee SHA256SUMS.txt
          ls -lh

      - name: Write release notes
        id: notes
        env:
          VERSION: ${{ needs.meta.outputs.version }}
          CHANNEL: ${{ needs.meta.outputs.channel }}
        run: |
          set -euo pipefail
          deb_version="${VERSION}"
          if [[ "${VERSION}" == *-* ]]; then
            deb_version="${VERSION%%-*}~${VERSION#*-}"
          fi
          {
            case "${CHANNEL}" in
              alpha)
                echo "First look at ${VERSION}. This is an alpha, so expect unfinished bits and the occasional surprise."
                echo
                echo "If you try it, please file issues. That's the whole point of putting this out."
                ;;
              beta)
                echo "${VERSION} is a beta. The main pieces are in place, but we are still shaking out bugs before a real release."
                echo
                echo "Worth installing if you want to help find problems. Maybe skip it if you need something quiet and boring."
                ;;
              rc)
                echo "${VERSION} is a release candidate. Unless something ugly shows up, the next cut should be the stable build."
                echo
                echo "Please try the Windows DNS apply/reset flow if you can. That is the part we care about most."
                ;;
              *)
                echo "UseDNS ${VERSION} is out."
                echo
                echo "Grab the build for your machine below. On Windows, run the app as Administrator if you actually need to change DNS."
                ;;
            esac
            echo
            echo "Downloads:"
            echo
            echo "- Windows: \`usedns-${VERSION}-windows-x86_64-setup.exe\` — run the setup wizard. It installs to Program Files and adds Start Menu / desktop shortcuts."
            echo "- Linux (Debian/Ubuntu): \`usedns_${deb_version}_amd64.deb\` — install with \`sudo apt install ./usedns_*.deb\`."
            echo "- Linux (tarball): \`usedns-${VERSION}-linux-x86_64.tar.gz\` — unpack and run \`./usedns\`."
            echo "- macOS Apple Silicon: \`usedns-${VERSION}-macos-aarch64.zip\` — unzip and drop \`UseDNS.app\` in Applications."
            echo "- macOS Intel: \`usedns-${VERSION}-macos-x86_64.zip\` — same as above, for Intel Macs."
            echo
            echo "SHA256 checksums are in \`SHA256SUMS.txt\`."
            echo
            echo "Changing DNS only works on Windows right now. The Linux and macOS builds will open the UI, but they will not write system DNS settings."
            echo
            echo "## What's in this tag"
          } > release-notes.md

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: UseDNS ${{ needs.meta.outputs.version }}
          prerelease: ${{ needs.meta.outputs.prerelease == 'true' }}
          generate_release_notes: true
          files: dist/**
          fail_on_unmatched_files: true
          body_path: release-notes.md
