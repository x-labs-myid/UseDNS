name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  meta:
    name: Validate tag
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.parse.outputs.version }}
      channel: ${{ steps.parse.outputs.channel }}
      prerelease: ${{ steps.parse.outputs.prerelease }}
    steps:
      - name: Parse release tag
        id: parse
        shell: bash
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME}"
          if [[ ! "${tag}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-(alpha|beta|rc)(\.[0-9]+)?)?$ ]]; then
            echo "Invalid tag '${tag}'."
            echo "Use vMAJOR.MINOR.PATCH, optionally with -alpha, -alpha.N, -beta, -beta.N, -rc, or -rc.N"
            echo "Examples: v1.0.0  v1.0.0-alpha.1  v1.0.0-beta.2  v1.0.0-rc.1"
            exit 1
          fi

          version="${tag#v}"
          channel="stable"
          prerelease="false"
          if [[ "${version}" == *"-alpha"* ]]; then
            channel="alpha"
            prerelease="true"
          elif [[ "${version}" == *"-beta"* ]]; then
            channel="beta"
            prerelease="true"
          elif [[ "${version}" == *"-rc"* ]]; then
            channel="rc"
            prerelease="true"
          fi

          echo "version=${version}" >> "${GITHUB_OUTPUT}"
          echo "channel=${channel}" >> "${GITHUB_OUTPUT}"
          echo "prerelease=${prerelease}" >> "${GITHUB_OUTPUT}"
          echo "Tag ${tag} → version ${version} (${channel})"

  build:
    name: ${{ matrix.name }}
    needs: meta
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows x64
            os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact: usedns.exe
            asset_suffix: windows-x86_64.exe
          - name: Linux x64
            os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            artifact: usedns
            asset_suffix: linux-x86_64
          - name: macOS Apple Silicon
            os: macos-latest
            target: aarch64-apple-darwin
            artifact: usedns
            asset_suffix: macos-aarch64
          - name: macOS Intel
            os: macos-13
            target: x86_64-apple-darwin
            artifact: usedns
            asset_suffix: macos-x86_64
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Linux GUI dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            pkg-config \
            libfontconfig1-dev \
            libfreetype6-dev \
            libxkbcommon-dev \
            libxkbcommon-x11-dev \
            libxcb1-dev \
            libxcb-render0-dev \
            libxcb-shape0-dev \
            libxcb-xfixes0-dev \
            libxcb-icccm4-dev

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Build release
        run: cargo build --locked --release --target ${{ matrix.target }}

      - name: Stage artifact
        shell: bash
        env:
          VERSION: ${{ needs.meta.outputs.version }}
        run: |
          mkdir -p dist
          src="target/${{ matrix.target }}/release/${{ matrix.artifact }}"
          dest="usedns-${VERSION}-${{ matrix.asset_suffix }}"
          cp "${src}" "dist/${dest}"
          if [[ "${RUNNER_OS}" != "Windows" ]]; then
            chmod +x "dist/${dest}"
          fi
          echo "ASSET_NAME=${dest}" >> "${GITHUB_ENV}"
          ls -lh dist

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ASSET_NAME }}
          path: dist/${{ env.ASSET_NAME }}
          if-no-files-found: error

  publish:
    name: GitHub Release
    needs: [meta, build]
    runs-on: ubuntu-latest
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Checksums
        working-directory: dist
        run: |
          sha256sum * | tee SHA256SUMS.txt
          ls -lh

      - name: Write release notes
        id: notes
        env:
          VERSION: ${{ needs.meta.outputs.version }}
          CHANNEL: ${{ needs.meta.outputs.channel }}
        run: |
          set -euo pipefail
          {
            case "${CHANNEL}" in
              alpha)
                echo "First look at ${VERSION}. This is an alpha, so expect unfinished bits and the occasional surprise."
                echo
                echo "If you try it, please file issues. That's the whole point of putting this out."
                ;;
              beta)
                echo "${VERSION} is a beta. The main pieces are in place, but we are still shaking out bugs before a real release."
                echo
                echo "Worth installing if you want to help find problems. Maybe skip it if you need something quiet and boring."
                ;;
              rc)
                echo "${VERSION} is a release candidate. Unless something ugly shows up, the next cut should be the stable build."
                echo
                echo "Please try the Windows DNS apply/reset flow if you can. That is the part we care about most."
                ;;
              *)
                echo "UseDNS ${VERSION} is out."
                echo
                echo "Grab the build for your machine below. On Windows, run the app as Administrator if you actually need to change DNS."
                ;;
            esac
            echo
            echo "Builds:"
            echo
            echo "- Windows 10/11 (x64): \`usedns-${VERSION}-windows-x86_64.exe\`"
            echo "- Linux (x64): \`usedns-${VERSION}-linux-x86_64\`"
            echo "- macOS Apple Silicon: \`usedns-${VERSION}-macos-aarch64\`"
            echo "- macOS Intel: \`usedns-${VERSION}-macos-x86_64\`"
            echo
            echo "SHA256 checksums are in \`SHA256SUMS.txt\`."
            echo
            echo "Changing DNS only works on Windows right now. The Linux and macOS builds will open the UI, but they will not write system DNS settings."
            echo
            echo "## What's in this tag"
          } > release-notes.md

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: UseDNS ${{ needs.meta.outputs.version }}
          prerelease: ${{ needs.meta.outputs.prerelease == 'true' }}
          generate_release_notes: true
          files: dist/**
          fail_on_unmatched_files: true
          body_path: release-notes.md
